openapi: 3.1.0
info:
  title: Northline Ecommerce API
  version: 1.0.0
  description: |
    Express + MongoDB API behind the Northline storefront. All amounts are integers in the
    currency's minor unit (paise for INR). Authenticated endpoints expect
    `Authorization: Bearer <jwt>`. Errors always use the shape `{ "error": { code, message, details? } }`.
servers:
  - url: http://localhost:8080/api/v1
tags:
  - name: Health
  - name: Auth
  - name: Categories
  - name: Products
  - name: Cart
  - name: Orders
  - name: Admin

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness and database status
      responses:
        '200':
          description: Database connected
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  db: { type: string, example: connected }
                  uptime: { type: integer }
        '503': { description: Database disconnected }

  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 2, maxLength: 60 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 72 }
                phone: { type: string }
                address: { type: string }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          {
            description: 'EMAIL_TAKEN',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '429': { description: 'RATE_LIMITED (20 requests / 15 minutes per IP)' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Exchange credentials for a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          {
            description: 'INVALID_CREDENTIALS (same response for unknown email and wrong password)',
          }
        '429': { description: RATE_LIMITED }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Auth]
      summary: Update profile fields
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                phone: { type: string }
                address: { type: string }
      responses:
        '200': { description: Updated user }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /categories:
    get:
      tags: [Categories]
      summary: List categories with product counts
      responses:
        '200':
          description: Categories sorted by name
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
    post:
      tags: [Categories, Admin]
      summary: Create a category (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: SLUG_TAKEN }

  /categories/{slug}:
    get:
      tags: [Categories]
      summary: Get a category by slug
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200': { description: Category }
        '404': { $ref: '#/components/responses/NotFound' }

  /categories/{id}:
    patch:
      tags: [Categories, Admin]
      summary: Update a category (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '200': { description: Updated }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Categories, Admin]
      summary: Delete an empty category (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Deleted }
        '409': { description: 'CATEGORY_IN_USE — products still reference it' }

  /products:
    get:
      tags: [Products]
      summary: List products with pagination, search, filters and sorting
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 12 },
          }
        - {
            name: q,
            in: query,
            description: 'Case-insensitive match on name, description and tags',
            schema: { type: string },
          }
        - { name: category, in: query, description: Category slug, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: minPrice, in: query, description: Minor units, schema: { type: integer } }
        - { name: maxPrice, in: query, description: Minor units, schema: { type: integer } }
        - { name: featured, in: query, schema: { type: boolean } }
        - {
            name: sort,
            in: query,
            schema:
              {
                type: string,
                enum: [newest, price_asc, price_desc, rating, name],
                default: newest,
              },
          }
      responses:
        '200':
          description: A page of products
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Products, Admin]
      summary: Create a product (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201': { description: Created, with a unique slug derived from the name }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /products/{slug}:
    get:
      tags: [Products]
      summary: Get a product by slug
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                type: object
                properties:
                  product: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }

  /products/{id}:
    patch:
      tags: [Products, Admin]
      summary: Update a product (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200': { description: Updated }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Products, Admin]
      summary: Delete a product (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /cart:
    get:
      tags: [Cart]
      summary: Get the current user's cart (created on first access)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/CartResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Cart]
      summary: Remove every line
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/CartResponse' }

  /cart/items:
    post:
      tags: [Cart]
      summary: Add a product (increments if already present)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: string }
                qty: { type: integer, minimum: 1, maximum: 99, default: 1 }
      responses:
        '200': { $ref: '#/components/responses/CartResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InsufficientStock' }

  /cart/items/{productId}:
    patch:
      tags: [Cart]
      summary: Set a line quantity (0 removes it)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qty]
              properties:
                qty: { type: integer, minimum: 0, maximum: 99 }
      responses:
        '200': { $ref: '#/components/responses/CartResponse' }
        '404': { description: Product not in cart }
        '409': { $ref: '#/components/responses/InsufficientStock' }
    delete:
      tags: [Cart]
      summary: Remove a line
      security: [{ bearerAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { $ref: '#/components/responses/CartResponse' }

  /orders:
    post:
      tags: [Orders]
      summary: Place an order from the cart
      description: |
        Reserves stock with one conditional decrement per line. If any line cannot be
        reserved the earlier reservations are released and 409 INSUFFICIENT_STOCK is returned.
        On success the cart is emptied and the order starts as `placed` with a pending mock payment.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shippingAddress]
              properties:
                shippingAddress: { $ref: '#/components/schemas/ShippingAddress' }
      responses:
        '201': { $ref: '#/components/responses/OrderResponse' }
        '400': { description: 'Empty cart or VALIDATION_ERROR' }
        '409': { $ref: '#/components/responses/InsufficientStock' }
    get:
      tags: [Orders, Admin]
      summary: List every order (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 12 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
      responses:
        '200': { description: 'Page of orders; each has user populated as { id, name, email }' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /orders/mine:
    get:
      tags: [Orders]
      summary: The current user's orders, newest first
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }

  /orders/mine/{id}:
    get:
      tags: [Orders]
      summary: One of the current user's orders
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/OrderResponse' }
        '404': { description: Not found, including orders that belong to someone else }

  /orders/mine/{id}/pay:
    post:
      tags: [Orders]
      summary: Complete the mock payment for a `placed` order
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cardLast4: { type: string, pattern: '^\d{4}$' }
      responses:
        '200': { $ref: '#/components/responses/OrderResponse' }
        '409': { description: 'ALREADY_PAID — order is not awaiting payment' }

  /orders/mine/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel a `placed` or `paid` order
      description: Releases reserved stock and marks a paid order as refunded.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/OrderResponse' }
        '409': { description: INVALID_STATUS_TRANSITION }

  /orders/{id}/status:
    patch:
      tags: [Orders, Admin]
      summary: Move an order to a new status (admin)
      description: |
        Allowed transitions: placed → paid | cancelled; paid → shipped | cancelled; shipped → delivered.
        Cancelling releases stock and refunds a paid order.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/OrderStatus' }
      responses:
        '200': { $ref: '#/components/responses/OrderResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 'INVALID_STATUS_TRANSITION with details.allowed' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-f\d]{24}$' }
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
  responses:
    ValidationError:
      description: 'VALIDATION_ERROR with details: [{ path, message }]'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 'UNAUTHORIZED — missing, invalid or expired token'
    Forbidden:
      description: 'FORBIDDEN — admin role required'
    NotFound:
      description: NOT_FOUND
    InsufficientStock:
      description: 'INSUFFICIENT_STOCK with details: { productId, requested, available }'
    CartResponse:
      description: The full cart
      content:
        application/json:
          schema:
            type: object
            properties:
              cart: { $ref: '#/components/schemas/Cart' }
    OrderResponse:
      description: The order
      content:
        application/json:
          schema:
            type: object
            properties:
              order: { $ref: '#/components/schemas/Order' }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
    Page:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [user, admin] }
        phone: { type: string }
        address: { type: string }
        createdAt: { type: string, format: date-time }
    AuthResult:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        token: { type: string }
    Category:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        image: { type: string }
        productCount: { type: integer }
    CategoryInput:
      type: object
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        image: { type: string }
    Product:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        price: { type: integer, description: Minor units }
        currency: { type: string, example: INR }
        images: { type: array, items: { type: string } }
        category:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            slug: { type: string }
        stock: { type: integer }
        rating:
          type: object
          properties:
            average: { type: number }
            count: { type: integer }
        tags: { type: array, items: { type: string } }
        featured: { type: boolean }
        createdAt: { type: string, format: date-time }
    ProductInput:
      type: object
      required: [name, description, price, category]
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        price: { type: integer }
        currency: { type: string, default: INR }
        images: { type: array, items: { type: string } }
        category: { type: string, description: Category id }
        stock: { type: integer, default: 0 }
        tags: { type: array, items: { type: string } }
        featured: { type: boolean, default: false }
    Totals:
      type: object
      properties:
        subtotal: { type: integer }
        shipping: { type: integer, description: '0 at or above 99900, otherwise 4900' }
        total: { type: integer }
    Cart:
      type: object
      properties:
        id: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              product: { $ref: '#/components/schemas/Product' }
              qty: { type: integer }
              lineTotal: { type: integer }
        itemCount: { type: integer }
        totals: { $ref: '#/components/schemas/Totals' }
    ShippingAddress:
      type: object
      required: [fullName, line1, city, state, postalCode, country, phone]
      properties:
        fullName: { type: string }
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
        country: { type: string }
        phone: { type: string }
    OrderStatus:
      type: string
      enum: [placed, paid, shipped, delivered, cancelled]
    Order:
      type: object
      properties:
        id: { type: string }
        user: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              product: { type: string }
              name: { type: string }
              slug: { type: string }
              image: { type: string }
              price: { type: integer }
              currency: { type: string }
              qty: { type: integer }
        totals: { $ref: '#/components/schemas/Totals' }
        currency: { type: string }
        shippingAddress: { $ref: '#/components/schemas/ShippingAddress' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        statusHistory:
          type: array
          items:
            type: object
            properties:
              status: { $ref: '#/components/schemas/OrderStatus' }
              at: { type: string, format: date-time }
        payment:
          type: object
          properties:
            provider: { type: string, enum: [mock] }
            status: { type: string, enum: [pending, paid, refunded] }
            reference: { type: string }
            paidAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
