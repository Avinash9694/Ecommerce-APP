<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta

      content="Northline is a full-stack e-commerce storefront: browse a curated catalog, manage a cart, check out with a mock payment and track orders. Includes an in-browser demo mode."

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Northline — Everyday essentials, made well" />

      property="og:description"
      content="Full-stack e-commerce storefront with cart, checkout, orders and an admin console."
    />
    <meta property="og:url" content="https://avinash9694.github.io/Ecommerce-APP/" />
    <meta name="theme-color" content="#fafaf9" />
    <link rel="icon" type="image/svg+xml" href="/Ecommerce-APP/favicon.svg" />

      rel="stylesheet"
    />
    <script>
      try {
        var t = localStorage.getItem('shop.theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
